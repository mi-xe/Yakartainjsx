# Carga opcional de variables locales. El archivo .env está excluido de Git/ZIPs de producción.
spring.config.import=optional:file:./.env[.properties]

spring.application.name=yakarta-backend
server.port=${SERVER_PORT:8080}

# Configuración MySQL. Puedes sobrescribir estas variables desde el entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/yakarta?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA crea/actualiza las tablas al iniciar. Los datos iniciales se cargan si el catálogo está vacío.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# La base usada por Yakarta es MariaDB; evita que Hibernate genere SQL de bloqueo incompatible.
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# La sesión se identifica mediante una cookie HttpOnly; no se guarda el usuario en localStorage.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Diagnóstico útil para comprobar fallos de persistencia sin mostrar contraseñas.
logging.level.org.springframework.jdbc.datasource=INFO
# Límites para las imágenes cargadas desde el panel de administrador.
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

# Directorio compartido por el endpoint de carga y el servidor de imágenes.
app.upload.dir=${APP_UPLOAD_DIR:uploads/productos}

# Google OAuth2 is optional. Supply GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables.
app.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# URL to which the backend returns the browser after Google authentication.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
